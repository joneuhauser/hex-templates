name: Tests
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ libboost-dev
          python3 -m pip install -r tools/requirements.txt
      - name: Solver and asset regressions
        env:
          THREADS: 4
          BUILD_JOBS: 2
        run: bash tests/run.sh
      - name: JavaScript syntax
        run: |
          node --check docs/assets/catalog.js
          node --check docs/assets/geode-sides.js
          node --input-type=module --check < docs/assets/viewer.js
